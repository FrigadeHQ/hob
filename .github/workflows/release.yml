# Push a tag like v0.2.0 (matching app/package.json "version") to build Hob for Mac, Windows and Linux
# and publish them as a GitHub release. The download links in README.md always point at the newest one.
# Running it by hand (Actions → Release → Run workflow) only builds: the installers are attached to the run, nothing is published.
#
# Mac signing and notarization use these repository secrets (without them, the Mac build is unsigned):
#   MAC_CERT_P12_BASE64, MAC_CERT_PASSWORD   Developer ID Application certificate (.p12, base64) and its password
#   APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID   for notarization
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: --mac
          - os: windows-latest
            platform: --win
          - os: ubuntu-latest
            platform: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # the unit tests cover Mac-only parts too (sandbox, PDFKit); Windows and Linux builds are previews for now
      - name: Test
        if: runner.os == 'macOS'
        run: pnpm -C app test
      - name: Build
        shell: bash
        run: |
          mkdir -p app/resources/bin
          pnpm -C app run native
          pnpm -C app exec electron-vite build
      - name: Package and publish
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.MAC_CERT_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          extra=""
          if [ "${{ matrix.platform }}" = "--mac" ]; then
            if [ -n "$CSC_LINK" ]; then [ -n "$APPLE_ID" ] && extra="-c.mac.notarize=true"; else export CSC_IDENTITY_AUTO_DISCOVERY=false; unset CSC_LINK CSC_KEY_PASSWORD; extra="-c.dmg.sign=false"; fi
          fi
          publish=never; [ "${{ github.ref_type }}" = "tag" ] && publish=always
          cd app && pnpm exec electron-builder ${{ matrix.platform }} --publish $publish $extra
      - name: Keep the installer (test runs)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: hob-${{ runner.os }}
          path: |
            app/dist/*.dmg
            app/dist/*.exe
            app/dist/*.AppImage
          if-no-files-found: error
