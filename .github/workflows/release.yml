# A release: `sh scripts/release.sh 0.2.0` sets the version, tags v0.2.0 and pushes; this builds Hob for Mac,
# Windows and Linux and publishes one GitHub release with all three, once every build has worked.
# The download links (README, hob.chat) point at releases/latest/download/<file>, and installed copies
# update themselves from the same release (latest*.yml).
# Running it by hand (Actions → Release → Run workflow) only builds: the installers are attached to the run, nothing is published.
#
# Mac signing and notarization use these repository secrets (without them, the Mac build is unsigned):
#   MAC_CERT_P12_BASE64, MAC_CERT_PASSWORD   Developer ID Application certificate (.p12, base64) and its password
#   APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID   for notarization
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: --mac
          - os: windows-latest
            platform: --win
          - os: ubuntu-latest
            platform: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: The tag matches the app's version
        if: github.ref_type == 'tag'
        shell: bash
        run: test "v$(node -p "require('./app/package.json').version")" = "${{ github.ref_name }}"
      # the unit tests include Mac-only parts (sandbox, PDFKit), so they run on the Mac build
      - name: Test
        if: runner.os == 'macOS'
        run: pnpm -C app test
      - name: Build
        shell: bash
        run: |
          mkdir -p app/resources/bin
          pnpm -C app run native
          pnpm -C app exec electron-vite build
      - name: Package
        shell: bash
        env:
          CSC_LINK: ${{ secrets.MAC_CERT_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          extra=""
          if [ "${{ matrix.platform }}" = "--mac" ]; then
            if [ -n "$CSC_LINK" ]; then [ -n "$APPLE_ID" ] && extra="-c.mac.notarize=true"; else export CSC_IDENTITY_AUTO_DISCOVERY=false; unset CSC_LINK CSC_KEY_PASSWORD; extra="-c.dmg.sign=false"; fi
          fi
          cd app && pnpm exec electron-builder ${{ matrix.platform }} --publish never $extra
      # the app inside is notarized by electron-builder; the disk image is checked when downloaded too
      - name: Notarize the disk image
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          [ -n "$APPLE_ID" ] || exit 0
          xcrun notarytool submit app/dist/Hob-mac-arm64.dmg --apple-id "$APPLE_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
          xcrun stapler staple app/dist/Hob-mac-arm64.dmg
          spctl -a -t open --context context:primary-signature -v app/dist/Hob-mac-arm64.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: hob-${{ runner.os }}
          path: |
            app/dist/*.dmg
            app/dist/*.zip
            app/dist/*.exe
            app/dist/*.AppImage
            app/dist/*.blockmap
            app/dist/latest*.yml
          if-no-files-found: error

  # one release with every installer, so the latest release never lacks one
  publish:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -la files
          gh release create "${{ github.ref_name }}" files/* --repo "${{ github.repository }}" --title "Hob ${GITHUB_REF_NAME#v}" --generate-notes --latest
