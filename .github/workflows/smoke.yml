# The real tools, nothing faked: Hob's Python (sandboxed), web search (SearXNG) and the image model (llama-server)
# on Mac, Windows and Linux: on their own, then called from inside the app. Downloads a few GB per system, so it
# has its own workflow next to ci.yml.
name: Smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  tools:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # the image model and Python need a few GB; Linux runners start nearly full
      - name: Make room (Linux)
        if: runner.os == 'Linux'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - run: pnpm install --frozen-lockfile
      - name: Real tools
        env:
          HOB_SMOKE: '1'
        run: pnpm -C app exec vitest run test/smoke.test.ts
      - name: Build
        shell: bash
        run: |
          mkdir -p app/resources/bin
          pnpm -C app run native
          pnpm -C app exec electron-vite build
      - name: Install Playwright
        run: pnpm -C app exec playwright install-deps
        if: runner.os == 'Linux'
      - name: Let Electron start (Linux)
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # the same tools, called from inside the app as on a user's computer
      - name: Real tools in the app
        shell: bash
        env:
          HOB_SMOKE: '1'
          HOB_BACKGROUND: '0'
        run: |
          cd app
          if [ "$RUNNER_OS" = "Linux" ]; then xvfb-run -a pnpm exec playwright test e2e/smoke-app.spec.ts; else pnpm exec playwright test e2e/smoke-app.spec.ts; fi
      - name: Keep the test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-report-${{ runner.os }}
          path: app/test-results
          if-no-files-found: ignore

  # GitHub's Windows runners are admins, and admins can do what most people's accounts can't (make symlinks, say).
  # The real tools again, as a standard user like on a user's PC.
  windows-standard-user:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Real tools as a standard user
        shell: pwsh
        run: |
          # GitHub's images turn on Developer Mode, which lets any account make symlinks; most PCs don't have it
          Set-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock' AllowDevelopmentWithoutDevLicense 0 -Type DWord
          $pw = ConvertTo-SecureString "Hob-$([guid]::NewGuid().ToString('N').Substring(0, 16))-aA1!" -AsPlainText -Force
          New-LocalUser -Name hobuser -Password $pw -AccountNeverExpires -PasswordNeverExpires | Out-Null
          Add-LocalGroupMember -Group Users -Member hobuser
          $cred = New-Object PSCredential('hobuser', $pw)
          $out = 'C:\hob-smoke'
          New-Item -ItemType Directory -Force $out | Out-Null
          # the account reads the checkout (node_modules too) and writes its results here
          icacls $env:GITHUB_WORKSPACE /grant 'hobuser:(OI)(CI)M' /T /C /Q | Out-Null
          icacls $out /grant 'hobuser:(OI)(CI)F' /T /C /Q | Out-Null
          $node = (Get-Command node).Source
          Push-Location app
          $vitest = node -p "require('path').join(require('path').dirname(require.resolve('vitest/package.json')), 'vitest.mjs')"
          Pop-Location
          icacls (Split-Path (Split-Path $node)) /grant 'hobuser:(OI)(CI)RX' /T /C /Q | Out-Null
          $script = @"
          cd /d "$env:GITHUB_WORKSPACE\app"
          mklink "$out\link-check" "%COMSPEC%" > "$out\mklink.txt" 2>&1
          rem its own temp and profile folders, not the admin's it inherits
          mkdir "$out\tmp" "$out\home" 2> nul
          set TEMP=$out\tmp
          set TMP=$out\tmp
          set USERPROFILE=$out\home
          set APPDATA=$out\home
          set LOCALAPPDATA=$out\home
          set GITHUB_ACTIONS=
          set HOB_SMOKE=1
          "$node" "$vitest" run test/smoke.test.ts > "$out\smoke.txt" 2>&1
          echo %ERRORLEVEL% > "$out\code.txt"
          "@
          Set-Content -Path "$out\run.cmd" -Value $script
          $p = Start-Process cmd.exe -ArgumentList '/c', "$out\run.cmd" -Credential $cred -LoadUserProfile -WorkingDirectory $out -Wait -PassThru
          Write-Host "--- can this account make symlinks? (it shouldn't, like most people's)"
          Get-Content "$out\mklink.txt"
          if (Test-Path "$out\link-check") { throw 'this account can make symlinks, so it is not like most people''s' }
          Write-Host '--- smoke test'
          Get-Content "$out\smoke.txt"
          $code = (Get-Content "$out\code.txt" -ErrorAction SilentlyContinue | Select-Object -First 1)
          if ("$code".Trim() -ne '0') { throw "the smoke test failed as a standard user (exit $code)" }

