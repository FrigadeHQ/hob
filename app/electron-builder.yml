appId: com.frigade.mabel
productName: Mabel
electronVersion: 44.7.2
copyright: Copyright © 2026 Frigade
# GitHub Releases: every v* tag builds Mac, Windows and Linux (.github/workflows/release.yml).
# Fixed file names, so releases/latest/download/<name> always points at the newest one.
publish:
  provider: github
  owner: FrigadeHQ
  repo: mabel
  releaseType: release
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - package.json
  # pulled in by transformers.js but never used (speech runs in the window, images aren't processed)
  - "!**/node_modules/onnxruntime-node/**"
  - "!**/node_modules/sharp/**"
  - "!**/node_modules/@img/**"
# built-in plugins ship as plain folders, read like any other plugin
extraResources:
  - from: plugins
    to: plugins
  # native helpers (scripts/build-native.mjs): mabel-pdf reads and fills PDFs with Apple's PDFKit and Vision
  - from: resources/bin
    to: bin
  # licenses of things bundled into the app (the reply font)
  - from: resources/licenses
    to: licenses
# double-clicking an MCP bundle offers Mabel (Claude Desktop stays the default if it's installed)
fileAssociations:
  - ext: [mcpb, dxt]
    name: MCP Bundle
    role: Viewer
    rank: Alternate
asarUnpack:
  # the local AI engine loads native binaries; they can't run from inside the asar archive
  - "**/node_modules/node-llama-cpp/**"
  - "**/node_modules/@node-llama-cpp/**"
mac:
  # a platform's files list replaces the one above, so it repeats it
  files:
    - out/**
    - package.json
    - "!**/node_modules/onnxruntime-node/**"
    - "!**/node_modules/sharp/**"
    - "!**/node_modules/@img/**"
    # this Mac build only needs the Apple Silicon engine binaries
    - "!**/node_modules/@node-llama-cpp/{linux,win,mac-x64}*/**"
    - "!**/node_modules/node-llama-cpp/bins/{linux,win,mac-x64}*/**"
  artifactName: Mabel-mac-${arch}.${ext}
  target:
    - target: dmg
      arch: [arm64]
  icon: build/icon.icns
  category: public.app-category.productivity
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    NSMicrophoneUsageDescription: Mabel uses the microphone for dictation. Speech is turned into text on this computer.
    NSCalendarsFullAccessUsageDescription: Mabel reads and adds events in your calendars when you ask it to. Everything stays on this Mac.
    NSCalendarsUsageDescription: Mabel reads and adds events in your calendars when you ask it to. Everything stays on this Mac.
    NSAppleEventsUsageDescription: Mabel uses the Mail app to find and read your email and write drafts when you ask it to. It never sends email itself.
  # signs with the Developer ID certificate in the keychain (or CSC_LINK on CI); notarized by scripts/release-mac.sh or CI
dmg:
  title: Mabel
  # build/background.png (+ @2x), made from build/dmg-background.svg by build/render-dmg.cjs
  background: build/background.png
  iconSize: 96
  window: { width: 660, height: 400 }
  contents:
    - { x: 180, y: 205 }
    - { x: 480, y: 205, type: link, path: /Applications }
  # the disk image is checked when downloaded, not just the app inside
  sign: true
win:
  artifactName: Mabel-windows-${arch}.${ext}
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.png
nsis:
  oneClick: true
  perMachine: false
linux:
  # the default comes from the package name (@mabel/app), which isn't a valid file name
  executableName: mabel
  artifactName: Mabel-linux-${arch}.${ext}
  target:
    - target: AppImage
      arch: [x64]
  icon: build/icon.png
  category: Utility
